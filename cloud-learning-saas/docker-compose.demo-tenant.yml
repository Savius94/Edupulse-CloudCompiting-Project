# Stack établissement démo standalone (Compose local, hors Swarm)
services:
  demo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenant_user
      POSTGRES_PASSWORD: tenant_password
      POSTGRES_DB: tenant_db
    volumes:
      - demo_tenant_db:/var/lib/postgresql/data
    networks:
      - tenant-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_user -d tenant_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-app:
    image: edupulse-tenant-app:local
    environment:
      DATABASE_URL: postgresql://tenant_user:tenant_password@demo-db:5432/tenant_db
      TENANT_SLUG: demo
      INSTITUTION_NAME: "Demo Campus Evalio"
      MAX_USERS: "200"
      ADMIN_EMAIL: direction@lycee-moulin.fr
      ADMIN_PASSWORD_HASH: ""
      ADMIN_FULL_NAME: "Direction Demo"
      JWT_SECRET: local_demo_tenant_jwt
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
    ports:
      - "8101:8000"
    depends_on:
      demo-db:
        condition: service_healthy
    networks:
      - saas-public-net
      - tenant-internal-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=saas-public-net"
      - "traefik.http.routers.demo.rule=Host(`demo.localhost`) || Host(`demo.edupulse.mnbll.fr`)"
      - "traefik.http.routers.demo.entrypoints=web,web8000"
      - "traefik.http.services.demo.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 20s

networks:
  saas-public-net:
    external: true
    name: saas-public-net
  tenant-internal-net:
    driver: bridge

volumes:
  demo_tenant_db:
