version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # 1. INFRASTRUCTURE MANAGER UNIQUEMENT (Registry + Proxy API Swarm + BDD)
  # ---------------------------------------------------------------------------
  registry:
    image: registry:2
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: host
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - portal-internal-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.35"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 32M

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NETWORKS: 1
      NODES: 1
      INFO: 1
      SWARM: 1
      VOLUMES: 1
      IMAGES: 1
      DISTRIBUTION: 1
      CONFIGS: 1
      SECRETS: 1
      POST: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - portal-internal-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M

  portal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_password
      POSTGRES_DB: portal_db
    volumes:
      - portal_db_data:/var/lib/postgresql/data
    networks:
      - portal-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d portal_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.40"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ---------------------------------------------------------------------------
  # 2. WORKERS UNIQUEMENT (Traefik Ingress + Page Principale portal-api)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
    command:
      - "--api.insecure=true"
      - "--ping=true"
      - "--ping.entryPoint=web"
      - "--providers.swarm.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=saas-public-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--entrypoints.web8000.address=:8000"
      - "--entrypoints.web8000.forwardedHeaders.insecure=true"
      - "--log.level=INFO"
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    networks:
      - saas-public-net
      - portal-internal-net
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.35"
          memory: 160M
        reservations:
          cpus: "0.05"
          memory: 32M

  portal-api:
    image: ${REGISTRY_HOST:-100.85.14.115:5000}/edupulse-portal-api:latest
    build:
      context: .
      dockerfile: portal/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      REGISTRY_HOST: ${REGISTRY_HOST:-100.85.14.115:5000}
      TENANT_IMAGE: ${REGISTRY_HOST:-100.85.14.115:5000}/edupulse-tenant-app:latest
      DATABASE_URL: postgresql://portal_user:portal_password@portal-db:5432/portal_db
      JWT_SECRET: ${JWT_SECRET:-super_secret_cloud_jwt_key_2026}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@edupulse.mnbll.fr}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-SuperSecretPassword123!}
      BASE_DOMAIN: ${BASE_DOMAIN:-edupulse.mnbll.fr}
      PUBLIC_PORT: ${PUBLIC_PORT:-80}
      TENANT_COMPOSE_PATH: /app/tenant-stack/docker-compose.tenant.yml
      ORCHESTRATOR_MODE: ${ORCHESTRATOR_MODE:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    depends_on:
      - portal-db
      - docker-socket-proxy
    networks:
      - saas-public-net
      - portal-internal-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      replicas: ${PORTAL_REPLICAS:-2}
      placement:
        constraints:
          - node.role == worker
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=saas-public-net"
        - "traefik.http.middlewares.portal-retry.retry.attempts=3"
        - "traefik.http.middlewares.portal-retry.retry.initialinterval=100ms"
        - "traefik.http.routers.portal.rule=Host(`${BASE_DOMAIN:-edupulse.mnbll.fr}`) || Host(`www.${BASE_DOMAIN:-edupulse.mnbll.fr}`) || Host(`cloudproject.mnbll.fr`) || Host(`localhost`) || Host(`127.0.0.1`)"
        - "traefik.http.routers.portal.middlewares=portal-retry"
        - "traefik.http.services.portal.loadbalancer.server.port=8000"
        - "traefik.http.services.portal.loadbalancer.healthcheck.path=/api/health"
        - "traefik.http.services.portal.loadbalancer.healthcheck.interval=3s"
        - "traefik.http.services.portal.loadbalancer.healthcheck.timeout=1s"

networks:
  saas-public-net:
    name: saas-public-net
    driver: ${NETWORK_DRIVER:-overlay}
    attachable: true
  portal-internal-net:
    driver: ${NETWORK_DRIVER:-overlay}
    attachable: true

volumes:
  portal_db_data:
  registry_data:
