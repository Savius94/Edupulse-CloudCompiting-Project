# Stack locale Windows/dev — indépendante du Swarm de prod
services:
  portal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_password
      POSTGRES_DB: portal_db
    volumes:
      - portal_db_data_local:/var/lib/postgresql/data
    networks:
      - portal-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d portal_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  portal-api:
    image: edupulse-portal-api:local
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      REGISTRY_HOST: ""
      TENANT_IMAGE: edupulse-tenant-app:local
      DATABASE_URL: postgresql://portal_user:portal_password@portal-db:5432/portal_db
      JWT_SECRET: local_dev_jwt_secret_2026
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@edupulse.mnbll.fr}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-SuperSecretPassword123!}
      BASE_DOMAIN: localhost
      PUBLIC_PORT: "80"
      TENANT_COMPOSE_PATH: /app/tenant-stack/docker-compose.tenant.yml
      ORCHESTRATOR_MODE: compose
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: "*"
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tenant-stack:/app/tenant-stack:ro
    ports:
      - "8001:8000"
    depends_on:
      portal-db:
        condition: service_healthy
    networks:
      - saas-public-net
      - portal-internal-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=saas-public-net"
      - "traefik.http.routers.portal.rule=Host(`localhost`) || Host(`127.0.0.1`)"
      - "traefik.http.routers.portal.entrypoints=web,web8000"
      - "traefik.http.services.portal.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 15s

  traefik:
    image: traefik:v3
    command:
      - "--api.insecure=true"
      - "--ping=true"
      - "--ping.entryPoint=web"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=saas-public-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--entrypoints.web8000.address=:8000"
      - "--entrypoints.web8000.forwardedHeaders.insecure=true"
      - "--log.level=INFO"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "80:80"
      - "8000:8000"
      - "8080:8080"
    networks:
      - saas-public-net
    depends_on:
      portal-api:
        condition: service_healthy

networks:
  saas-public-net:
    name: saas-public-net
    driver: bridge
  portal-internal-net:
    name: portal-internal-net
    driver: bridge

volumes:
  portal_db_data_local:
