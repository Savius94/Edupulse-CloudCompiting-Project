services:
  tenant-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenant_user
      POSTGRES_PASSWORD: tenant_password
      POSTGRES_DB: tenant_db
    volumes:
      - tenant_db_data:/var/lib/postgresql/data
    networks:
      - tenant-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_user -d tenant_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  tenant-app:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: edupulse-tenant-app:latest
    environment:
      DATABASE_URL: postgresql://tenant_user:tenant_password@tenant-db:5432/tenant_db
      TENANT_SLUG: ${TENANT_SLUG}
      INSTITUTION_NAME: "${INSTITUTION_NAME}"
      MAX_USERS: ${MAX_USERS:-200}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH}"
      ADMIN_FULL_NAME: "${ADMIN_FULL_NAME:-Administrateur Principal}"
      JWT_SECRET: "${JWT_SECRET:-super-secret-tenant-key}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      no_proxy: "${no_proxy:-}"
    ports:
      - "${TENANT_PORT:-8101}:8000"
    depends_on:
      - tenant-db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=saas-public-net"
      - "traefik.http.routers.${TENANT_SLUG}.rule=Host(`${TENANT_SLUG}.${BASE_DOMAIN:-edupulse.mnbll.fr}`) || Host(`${TENANT_SLUG}.localhost`)"
      - "traefik.http.services.${TENANT_SLUG}.loadbalancer.server.port=8000"
    networks:
      - saas-public-net
      - tenant-internal-net
    restart: unless-stopped
    deploy:
      replicas: ${REPLICAS:-1}
      placement:
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          cpus: "${CPU_LIMIT:-0.50}"
          memory: "${MEM_LIMIT:-512M}"
        reservations:
          cpus: "0.10"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=saas-public-net"
        - "traefik.http.routers.${TENANT_SLUG}.rule=Host(`${TENANT_SLUG}.${BASE_DOMAIN:-edupulse.mnbll.fr}`) || Host(`${TENANT_SLUG}.localhost`)"
        - "traefik.http.services.${TENANT_SLUG}.loadbalancer.server.port=8000"

networks:
  saas-public-net:
    external: true
    name: saas-public-net
  tenant-internal-net:
    driver: ${TENANT_NET_DRIVER:-overlay}
    attachable: true

volumes:
  tenant_db_data:
