version: "3.8"

services:
  tenant-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenant_user
      POSTGRES_PASSWORD: tenant_password
      POSTGRES_DB: tenant_db
    volumes:
      - tenant_db_data:/var/lib/postgresql/data
    networks:
      - tenant-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenant_user -d tenant_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.40"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 48M

  tenant-app:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: ${TENANT_IMAGE:-100.85.14.115:5000/edupulse-tenant-app:latest}
    environment:
      DATABASE_URL: postgresql://tenant_user:tenant_password@tenant-db:5432/tenant_db
      TENANT_SLUG: ${TENANT_SLUG}
      INSTITUTION_NAME: "${INSTITUTION_NAME}"
      MAX_USERS: ${MAX_USERS:-200}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH}"
      ADMIN_FULL_NAME: "${ADMIN_FULL_NAME:-Administrateur Principal}"
      JWT_SECRET: "${JWT_SECRET:-super-secret-tenant-key}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      no_proxy: "${no_proxy:-}"
    ports:
      - "${TENANT_PORT:-8101}:8000"
    depends_on:
      - tenant-db
    networks:
      - saas-public-net
      - tenant-internal-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: ${REPLICAS:-2}
      placement:
        constraints:
          - node.role == worker
        preferences:
          - spread: node.id
      update_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: continue
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "${CPU_LIMIT:-0.40}"
          memory: "${MEM_LIMIT:-256M}"
        reservations:
          cpus: "${CPU_RES:-0.05}"
          memory: "${MEM_RES:-64M}"
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=saas-public-net"
        - "traefik.http.middlewares.${TENANT_SLUG}-retry.retry.attempts=3"
        - "traefik.http.middlewares.${TENANT_SLUG}-retry.retry.initialinterval=100ms"
        - "traefik.http.routers.${TENANT_SLUG}.rule=Host(`${TENANT_SLUG}.${BASE_DOMAIN:-edupulse.mnbll.fr}`) || Host(`${TENANT_SLUG}.localhost`)"
        - "traefik.http.routers.${TENANT_SLUG}.middlewares=${TENANT_SLUG}-retry"
        - "traefik.http.services.${TENANT_SLUG}.loadbalancer.server.port=8000"

networks:
  saas-public-net:
    external: true
    name: saas-public-net
  tenant-internal-net:
    driver: ${TENANT_NET_DRIVER:-overlay}
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: "1200"

volumes:
  tenant_db_data:
